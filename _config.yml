summary:
  My graduation from the National Defense University, system engineering branch, is followed by six years in the army units[cite: 1].
  The next three years were spent with an M.Sc. at the Bilkent University, Computer Engineering Department[cite: 1].
  Since then, much knowledge has been gained within tens of ITC and research projects[cite: 1].
  Parallel to those, a Ph.D. study is accomplished at the Middle East Technical University, Graduate School of Informatics, Cognitive Science Department[cite: 1].
  Engaged in innovation projects about the areas of Cognitive-AI, Affective Computing, Federated Learning, Image Processing, Video Analytics, 3D, eXtended Reality, and electro-optic communication targeting pain-points in sustainability, energy efficiency, health informatics, and smart cities[cite: 1].

